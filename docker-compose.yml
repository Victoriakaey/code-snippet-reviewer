services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Defaults to `mock` so `docker compose up --build` runs the FULL demo workflow with no
      # Ollama and no API key — mock findings are deterministic placeholders, labelled
      # "simulated — not real AI" in the UI. Override for a real review:
      #   LLM_PROVIDER=ollama docker compose up   (needs a host-installed Ollama; see below)
      #   LLM_PROVIDER=openai OPENAI_API_KEY=sk-... docker compose up   (cloud provider)
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      # A container's localhost is the container, not the host. The ollama provider reaches a
      # host-installed Ollama via host.docker.internal (Docker Desktop resolves it; the
      # extra_hosts entry below adds it on Linux).
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      # Forwarded from the host shell when set; never baked into the image. Only used when
      # LLM_PROVIDER=openai.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5-mini}
      # Absolute path inside the container; the named volume persists the SQLite file.
      - DATABASE_URL=sqlite:////app/data/app.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # The Vite dev proxy forwards /api to the backend service on the compose network.
      - VITE_API_TARGET=http://backend:8000
    depends_on:
      - backend

volumes:
  backend_data:
